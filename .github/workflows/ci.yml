name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: test-results
          path: .build/tests
  mac:
    needs: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 build.py mac
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: mac-ci
          path: dist/1000-Word-Philosophy-Mac.zip
  android:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - run: python3 build.py android
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: android-ci-development-signed
          path: dist/1000-Word-Philosophy-Android.apk
