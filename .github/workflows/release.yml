name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
  mac:
    needs: test
    runs-on: macos-15
    env:
      APP_VERSION: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 build.py mac
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-mac
          path: dist/1000-Word-Philosophy-Mac.zip
  android:
    needs: test
    runs-on: ubuntu-24.04
    env:
      APP_VERSION: ${{ github.ref_name }}
      RELEASE_BUILD: '1'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"'
      - name: Restore release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64,os,pathlib
          encoded=os.environ.get('KEYSTORE_BASE64')
          if not encoded: raise SystemExit('ANDROID_KEYSTORE_BASE64 secret is missing')
          key=pathlib.Path(os.environ['RUNNER_TEMP'])/'philosophy-signing.p12'
          key.write_bytes(base64.b64decode(encoded,validate=True))
          key.chmod(0o600)
          with open(os.environ['GITHUB_ENV'],'a') as env: env.write('ANDROID_KEYSTORE_PATH='+str(key)+'\n')
          PY
      - run: python3 build.py android
      - name: Remove temporary signing key
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-android
          path: dist/1000-Word-Philosophy-Android.apk
  web:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - run: python3 scripts/build_web.py
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-web
          path: dist/1000-Word-Philosophy-Web.zip
  publish:
    needs: [mac, android, web]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import hashlib,pathlib
          root=pathlib.Path('dist')
          with (root/'SHA256SUMS.txt').open('w') as out:
              for path in sorted(root.iterdir()):
                  if path.name != 'SHA256SUMS.txt': out.write(hashlib.sha256(path.read_bytes()).hexdigest()+'  '+path.name+'\n')
          PY
          gh release create "$RELEASE_TAG" dist/* --verify-tag --title "$RELEASE_TAG" --notes-file docs/RELEASE-NOTES.md
